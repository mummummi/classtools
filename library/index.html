<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

*{box-sizing:border-box}

  --bg:#E9ECE6; --paper:#FFFFFF; --ink:#1E2B25; --ink2:#4B5650; --mute:#87918A; --line:#D8DDD5; --line2:#E9ECE6;

.desk-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}

.stu:hover{border-color:var(--ink);transform:translateY(-1px)}

.stu .nm{font-size:20px;font-weight:700;letter-spacing:-.3px}
.stu .lo{position:absolute;top:13px;right:14px;font-size:12px;font-weight:700;color:#8A6418;display:flex;align-items:center;gap:5px}
.stu .lo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc)}
.stu .lo.late{color:var(--warn)}.stu .lo.late::before{background:var(--warn)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 18px}
.cover{position:relative;aspect-ratio:3/4;border:none;border-radius:3px 9px 9px 3px;color:#fff;padding:16px 14px 12px 20px;display:flex;flex-direction:column;text-align:left;background:var(--c);box-shadow:inset 7px 0 0 rgba(0,0,0,.22),inset 8px 0 0 rgba(255,255,255,.12),0 2px 4px rgba(24,33,58,.12),0 12px 22px -12px rgba(24,33,58,.45);transition:transform .18s}
.cover:hover:not(:disabled){transform:translateY(-4px) rotate(-.6deg)}

.who{display:flex;align-items:flex-end;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.who .title{margin:0}

.loan .t{flex:1;min-width:0}
.loan .t b{font-family:var(--serif);font-size:18px}
.big{font-size:16px;padding:11px 22px;border-radius:9px}
.search{width:min(360px,100%)}
tr.late td{background:#FBF1EE}
.bars div{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:12px;margin:9px 0;font-size:14.5px}

#print div{border:1px dashed #999;padding:8px;height:26mm;font-size:11pt;overflow:hidden}#print b{font-size:18pt;display:block}}
</style>

<body>
<header>
  <h1><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></span>학급문고</h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <span class="sync" id="sync"></span>
  <a class="sm" id="swap" style="font-size:13px;color:var(--mute);text-decoration:none"></a>
</header>
<main id="main"></main>
<div id="print"></div>
<script>
const PAGE = 'student';
const APP_NAME = '학급문고 대출·반납';
const SCHEMA = {
  students: [['no', '번호'], ['name', '이름']],
  books: [['id', '도서번호'], ['title', '제목'], ['author', '지은이'], ['status', '상태'], ['memo', '메모']],
  settings: [['key', '항목'], ['val', '값']],
  loans: [['lid', '기록번호'], ['bookId', '도서번호'], ['title', '제목'], ['no', '번호'], ['name', '이름'], ['out', '대출일'], ['due', '반납예정일'], ['back', '반납일']]
};
const SHEETNAMES = { students: '학생', books: '도서', settings: '설정', loans: '대출기록' };
function optOf(db) { const g = k => (db.settings || []).find(x => x.key === k); const d = g('대출기간'), m = g('최대권수'); return { days: d ? Number(d.val) || 7 : 7, max: m ? Number(m.val) : 2 }; }
const MERGE_ACTIONS = [];

function addDays(ds, n) {
  const p = ds.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2] + Number(n || 0));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* 대출·반납 규칙 — 화면(체험 모드)과 구글 시트(Apps Script)가 같은 코드를 씁니다 */
function core(db, req, today) {
  const p = req.data || {}, dirty = {};
  const fail = m => { throw new Error(m); };
  const S = v => String(v == null ? '' : v).trim();
  const sortStu = () => db.students.sort((a, b) => (Number(a.no) || 999) - (Number(b.no) || 999) || a.name.localeCompare(b.name));
  const nextId = () => {
    let mx = 0; db.books.forEach(b => { const m = /^B?(\d+)$/i.exec(b.id); if (m) mx = Math.max(mx, Number(m[1])); });
    return 'B' + String(mx + 1).padStart(3, '0');
  };
  switch (req.action) {
    case 'getAll': break;
    case 'addStudents':
      (p.list || []).forEach(s => {
        const no = S(s.no), name = S(s.name); if (!name) return;
        const ex = db.students.find(x => no ? x.no === no : x.name === name);
        if (ex) ex.name = name; else db.students.push({ no, name });
      });
      sortStu(); dirty.students = 1; break;
    case 'delStudent': {
      if (db.loans.some(l => !l.back && l.no === S(p.no) && l.name === S(p.name))) fail('빌린 책이 있는 학생은 지울 수 없어요. 먼저 반납해 주세요.');
      db.students = db.students.filter(s => !(s.no === S(p.no) && s.name === S(p.name))); dirty.students = 1; break;
    }
    case 'addBooks':
      (p.list || []).forEach(b => {
        const title = S(b.title); if (!title) return;
        const id = S(b.id), ex = id && db.books.find(x => x.id === id);
        if (ex) { ex.title = title; if (S(b.author)) ex.author = S(b.author); return; }
        db.books.push({ id: id || nextId(), title, author: S(b.author), status: '대출가능', memo: S(b.memo) });
      });
      dirty.books = 1; break;
    case 'updateBook': {
      const b = db.books.find(x => x.id === S(p.id)) || fail('책을 찾지 못했어요.');
      if (p.title != null) { if (!S(p.title)) fail('제목을 입력해 주세요.'); b.title = S(p.title); }
      if (p.author != null) b.author = S(p.author);
      if (p.memo != null) b.memo = S(p.memo);
      if (p.status === '분실' || p.status === '보관') { if (b.status === '대출중') fail('대출 중인 책은 먼저 반납해 주세요.'); b.status = p.status; }
      if (p.status === '대출가능' && b.status !== '대출중') b.status = '대출가능';
      dirty.books = 1; break;
    }
    case 'delBook': {
      const b = db.books.find(x => x.id === S(p.id)) || fail('책을 찾지 못했어요.');
      if (b.status === '대출중') fail('대출 중인 책은 지울 수 없어요.');
      db.books = db.books.filter(x => x !== b); dirty.books = 1; break;
    }
    case 'borrow': {
      const b = db.books.find(x => x.id === S(p.bookId)) || fail('없는 도서번호예요.');
      if (b.status === '대출중') fail('『' + b.title + '』은(는) 이미 누가 빌려 갔어요.');
      if (b.status !== '대출가능') fail('『' + b.title + '』은(는) 지금 빌릴 수 없는 책이에요(' + b.status + ').');
      if (!db.students.some(s => s.no === S(p.no) && s.name === S(p.name))) fail('학생 명단에 없는 학생이에요.');
      const opt = optOf(db), max = opt.max;
      const mine = db.loans.filter(l => !l.back && l.no === S(p.no) && l.name === S(p.name)).length;
      if (max && mine >= max) fail('한 사람이 ' + max + '권까지 빌릴 수 있어요. 먼저 반납해 주세요.');
      db.loans.push({ lid: 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), bookId: b.id, title: b.title, no: S(p.no), name: S(p.name), out: today, due: addDays(today, opt.days), back: '' });
      b.status = '대출중'; dirty.books = dirty.loans = 1; break;
    }
    case 'return': {
      const b = db.books.find(x => x.id === S(p.bookId)) || fail('없는 도서번호예요.');
      const l = db.loans.find(x => !x.back && x.bookId === b.id) || fail('『' + b.title + '』은(는) 빌려 간 기록이 없어요.');
      l.back = today; b.status = '대출가능'; dirty.books = dirty.loans = 1; break;
    }
    case 'extend': {
      const l = db.loans.find(x => x.lid === S(p.lid) && !x.back) || fail('대출 기록을 찾지 못했어요.');
      l.due = addDays(l.due > today ? l.due : today, optOf(db).days); dirty.loans = 1; break;
    }
    case 'setOpt': {
      const set = (k, v) => { const r = db.settings.find(x => x.key === k); if (r) r.val = String(v); else db.settings.push({ key: k, val: String(v) }); };
      set('대출기간', Math.max(1, Math.min(60, Number(p.days) || 7))); set('최대권수', Math.max(0, Math.min(20, Number(p.max) || 0)));
      dirty.settings = 1; break;
    }
    default: fail('알 수 없는 요청: ' + req.action);
  }
  return { dirty: Object.keys(dirty) };
}

/* ===== 저장소: 구글 시트(GAS) 또는 이 기기(체험 모드) ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function emptyDb() { const d = {}; Object.keys(SCHEMA).forEach(k => d[k] = []); return d; }

const Store = {
  db: emptyDb(), q: [], busy: false, onChange: () => {}, onSync: () => {},
  cfg() { return LS.get(APP_KEY + '-cfg', { url: '', pw: '' }); },
  setCfg(c) { LS.set(APP_KEY + '-cfg', c); },
  remote() { return !!this.cfg().url; },
  async send(req) {
    const c = this.cfg();
    const res = await fetch(c.url, { method: 'POST', body: JSON.stringify(Object.assign({}, req, { pw: c.pw })) });
    let j; try { j = await res.json(); } catch (_) { throw new Error('응답을 읽지 못했어요. 배포 주소(/exec)와 액세스 권한(모든 사용자)을 확인해 주세요.'); }
    if (!j.ok) throw new Error(j.err || '알 수 없는 오류');
    return j;
  },
  async init() {
    if (!this.remote()) { this.db = Object.assign(emptyDb(), LS.get(APP_KEY + '-db', null) || (typeof DEMO !== 'undefined' ? DEMO() : {})); this.saveLocal(); this.onChange(); this.onSync('local'); return; }
    this.onSync('saving');
    try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); this.onSync('ok'); }
    catch (e) { this.onSync('err', e.message); throw e; }
    this.onChange();
  },
  saveLocal() { LS.set(APP_KEY + '-db', this.db); },
  /* 화면에 먼저 반영하고(바로 보임), 시트에는 순서대로 저장 */
  run(action, data) {
    const req = { action, data };
    const backup = clone(this.db);
    try { core(this.db, clone(req), todayStr()); }
    catch (e) { this.db = backup; toast('⚠️ ' + e.message, true); return false; }
    this.onChange();
    if (!this.remote()) { this.saveLocal(); return true; }
    this.q.push(req); this.pump(); return true;
  },
  async pump() {
    if (this.busy) return; this.busy = true; this.onSync('saving');
    while (this.q.length) {
      let req = this.q[0], n = 1;
      if (MERGE_ACTIONS.includes(req.action)) { // 연속 체크는 한 번에 모아서 저장
        while (n < this.q.length && this.q[n].action === req.action) n++;
        const list = [].concat(...this.q.slice(0, n).map(r => r.data.list));
        req = { action: req.action, data: { list } };
      }
      try {
        const r = await this.send(req);
        this.q.splice(0, n);
        if (!this.q.length) { this.db = Object.assign(emptyDb(), r.db); this.onChange(); }
      } catch (e) {
        this.q.length = 0; toast('⚠️ 저장 실패: ' + e.message, true);
        try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); } catch (_) {}
        this.onChange(); this.busy = false; this.onSync('err', e.message); return;
      }
    }
    this.busy = false; this.onSync('ok');
  },
  async refresh() {
    if (!this.remote() || this.busy || this.q.length) return;
    try { const r = await this.send({ action: 'getAll' }); if (!this.busy && !this.q.length) { this.db = Object.assign(emptyDb(), r.db); this.onChange(true); this.onSync('ok'); } } catch (_) {}
  }
};

let toastT;
function toast(msg, bad) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 4500 : 2200);
}
function modal(html, onMount) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="mbox">' + html + '</div>';
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  document.body.appendChild(m); if (onMount) onMount(m); return m;
}
function copyText(txt) {
  const done = () => toast('📋 복사했어요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) { toast('복사하지 못했어요', true); } ta.remove(); }
}
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

  return `<div class="grid2"><div class="card"><h2>학생 등록</h2><p class="muted" style="margin:0 0 6px">한 줄에 한 명씩 <b>번호 이름</b>으로 적어요. 엑셀에서 두 칸을 복사해 붙여 넣어도 돼요. 같은 번호가 있으면 이름을 고쳐요.</p>
  <textarea id="stuPaste" placeholder="1 김하늘&#10;2 이도윤&#10;3 박서연"></textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addStu()">등록하기</button></div></div>
  <div class="card"><h2>학생 명단 (${Store.db.students.length}명)</h2>${Store.db.students.length ? `<table class="list"><tr><th>번호</th><th>이름</th><th>지금까지 빌린 책</th><th></th></tr>${Store.db.students.map(s => `<tr><td>${esc(s.no)}</td><td><b>${esc(s.name)}</b></td><td>${cnt(s)}권</td><td><button class="sm danger" onclick="confirm('${esc(s.name)} 학생을 명단에서 지울까요?')&&Store.run('delStudent',{no:'${esc(s.no)}',name:'${esc(s.name)}'})">지우기</button></td></tr>`).join('')}</table>` : '<div class="empty">아직 학생이 없어요.</div>'}</div></div>`;
}
function addStu() {
  const list = parseLines($('#stuPaste').value).map(line => { const c = line.split(/[\t,]+|\s+/).filter(Boolean); return /^\d+$/.test(c[0]) ? { no: c[0], name: c.slice(1).join(' ') } : { no: '', name: c.join(' ') }; }).filter(s => s.name);
  if (!list.length) return toast('학생을 적어 주세요', true);
  if (Store.run('addStudents', { list })) toast(list.length + '명 등록했어요');
}

/* ---------- 통계 ---------- */
function vStat() {
  if (!UI.from) { const t = new Date(); UI.from = (t.getMonth() + 1 >= 3 ? t.getFullYear() : t.getFullYear() - 1) + '-03-01'; }
  const ls = Store.db.loans.filter(l => l.out >= UI.from);
  const tally = key => { const m = {}; ls.forEach(l => { const k = key(l); m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const bars = (arr, lab) => { const mx = arr.length ? arr[0][1] : 1; return arr.length ? `<div class="bars">${arr.slice(0, 15).map(([k, v]) => `<div><span>${esc(lab(k))}</span><span><i style="width:${Math.max(2, v / mx * 100)}%"></i></span><b>${v}</b></div>`).join('')}</div>` : '<div class="empty">기록이 없어요.</div>'; };
  const byStu = Store.db.students.map(s => [stuKey(s), ls.filter(l => l.no === s.no && l.name === s.name).length]).sort((a, b) => b[1] - a[1]);
  const byMonth = tally(l => l.out.slice(0, 7)).sort((a, b) => a[0].localeCompare(b[0]));
  return `<div class="card row"><b>기간</b><input type="date" value="${UI.from}" onchange="UI.from=this.value;render()"> 부터 오늘까지 · 대출 <b>${ls.length}</b>건 <span class="sp" style="flex:1"></span><button class="sm" onclick="copyReaders()">독서왕 명단 복사</button></div>
  <div class="grid2"><div class="card"><h2>많이 읽은 친구</h2>${bars(byStu, k => { const s = findStu(k); return s ? s.no + '번 ' + s.name : k; })}</div>
  <div class="card"><h2>인기 있는 책</h2>${bars(tally(l => l.title), k => k)}</div></div>
  <div class="card"><h2>월별 대출</h2>${bars(byMonth, k => k.replace('-', '년 ') + '월')}</div>`;
}
function copyReaders() {
  const ls = Store.db.loans.filter(l => l.out >= UI.from);
  const arr = Store.db.students.map(s => [s, ls.filter(l => l.no === s.no && l.name === s.name).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  copyText('학급문고 독서 기록 (' + md(UI.from) + '~)\n' + arr.map((x, i) => `${i + 1}. ${x[0].no}번 ${x[0].name} — ${x[1]}권`).join('\n'));
}

/* ---------- 설정 ---------- */
function vSet() {
  const c = Store.cfg(), o = OPT();
  return `<div class="grid2"><div class="card"><h2>구글 시트 연결</h2>
  <label class="f">Apps Script 웹 앱 주소 (…/exec 로 끝나요)</label><input id="sUrl" style="width:100%" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="f">연결 비밀번호 (Code.gs 맨 위 PASSWORD와 같게)</label><input id="sPw" type="password" style="width:100%" value="${esc(c.pw)}">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveConn()">저장하고 연결</button>${c.url ? '<button onclick="disconnect()">연결 끊기</button>' : ''}</div></div>
  <div class="card"><h2>대출 규칙</h2><p class="muted" style="margin:0">${c.url ? '시트에 저장돼서 학생용 화면에도 똑같이 적용돼요.' : '체험 모드에서는 이 기기에만 저장돼요.'}</p>
  <label class="f">대출 기간 (일)</label><input id="oD" type="number" min="1" max="60" value="${o.days}">
  <label class="f">한 사람이 빌릴 수 있는 권수 (0이면 제한 없음)</label><input id="oM" type="number" min="0" max="20" value="${o.max}">
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="saveOpt()">규칙 저장</button></div></div></div>
  <div class="card"><h2>학생용 화면 열기</h2>
  ${c.url ? `<p class="muted" style="margin:0 0 10px">아래 주소를 학급 태블릿에서 한 번 열면 시트 연결까지 저절로 돼요. 연결 정보가 들어 있으니 학생들에게 공유하지 말고 태블릿에서만 여세요.</p>
  <div class="row"><input id="kidUrl" readonly style="flex:1;min-width:240px" value="${esc(kidLink())}"><button class="btn" onclick="copyText($('#kidUrl').value)">주소 복사</button><a class="sm" href="${esc(kidLink())}" target="_blank" rel="noopener"><button>새 탭에서 열기</button></a></div>`
  : `<p class="muted" style="margin:0 0 10px">구글 시트에 연결하면 학생용 태블릿에 넣을 주소가 여기에 나와요.</p><a href="index.html" target="_blank" rel="noopener"><button>학생용 화면 미리 보기</button></a>`}</div>
  ${!c.url ? `<div class="card"><h2>체험 자료</h2><button class="danger" onclick="if(confirm('이 기기의 체험 자료를 모두 지우고 예시로 되돌릴까요?')){LS.set(APP_KEY+'-db',null);Store.init()}">체험 자료 초기화</button></div>` : ''}`;
}
function kidLink() { const c = Store.cfg(); return new URL('index.html', location.href).href + '#c=' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: c.url, p: c.pw })))); }
async function saveConn() {
  const url = $('#sUrl').value.trim(), pw = $('#sPw').value;
  if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('주소는 https://script.google.com/… /exec 형태여야 해요', true);
  Store.setCfg({ url, pw });
  try { await Store.init(); toast('구글 시트에 연결했어요'); render(); } catch (e) { toast('연결 실패: ' + e.message, true); }
}
function disconnect() { Store.setCfg({ url: '', pw: '' }); Store.init(); toast('체험 모드로 바꿨어요'); }
function saveOpt() { if (Store.run('setOpt', { days: $('#oD').value, max: $('#oM').value })) toast('대출 규칙을 저장했어요'); }

/* ---------- 시작 ---------- */
document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'qret') quickReturn(); });
(function () { // 학생용 주소(#c=…)로 열면 연결 정보 저장
  const m = /#c=([^&]+)/.exec(location.hash);
  if (m) { try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); Store.setCfg({ url: o.u, pw: o.p }); } catch (_) {} history.replaceState(null, '', location.pathname); }
})();
if (PAGE === 'student') $('#swap').remove(); else { $('#swap').textContent = '학생용 화면 열기'; $('#swap').href = 'index.html'; $('#swap').target = '_blank'; }
if (PAGE === 'student') { $('#nav').hidden = true; document.title = '학급문고'; } else { document.title = '학급문고 관리'; $('header h1').insertAdjacentHTML('beforeend', '<span class="pill acc" style="font-family:var(--sans)">관리</span>'); }
Store.onChange = soft => render(soft);
Store.onSync = (s, m) => { const el = $('#sync'); el.className = 'sync ' + s; el.textContent = s === 'local' ? '체험 모드' : s === 'saving' ? '저장 중' : s === 'ok' ? '구글 시트 연결됨' : '연결 문제'; el.title = m || ''; };
Store.init().catch(() => { if (PAGE === 'admin') { UI.tab = 'set'; render(); } });
setInterval(() => { if (!document.querySelector('.modal')) Store.refresh(); }, 30000);
let idleT; ['click', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(idleT); idleT = setTimeout(() => { if (UI.tab === 'desk' && UI.who && !document.querySelector('.modal')) { UI.who = null; UI.q = ''; render(); } }, 90000); }));
</script>
</body>
</html>

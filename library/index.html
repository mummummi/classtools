<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 학급문고 대출·반납</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f3ee;--card:#fff;--ink:#23262e;--mute:#6b7080;--line:#e3e0d8;--pri:#2f6f5e;--pri2:#e4f1ec;--warn:#c2410c;--warn2:#fde8dc;--ok:#15803d;--ok2:#dcfce7;--r:14px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
button:hover{border-color:#c9c4b8}
button:disabled{opacity:.45;cursor:default}
.btn{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.btn:hover{filter:brightness(1.08);border-color:var(--pri)}
.ghost{background:transparent}
.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.danger{color:var(--warn)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
header .sp{flex:1}
.sync{font-size:13px;padding:4px 10px;border-radius:99px;background:#ffffff1f;white-space:nowrap}
.sync.err{background:#c2410c}
nav{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:52px;z-index:15}
nav button{border:none;background:transparent;border-radius:10px 10px 0 0;padding:10px 14px;color:var(--mute);font-weight:600}
nav button[aria-current=true]{background:var(--card);color:var(--ink);box-shadow:0 -1px 0 var(--line) inset,1px 0 0 var(--line),-1px 0 0 var(--line)}
main{padding:18px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute);font-size:14px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700;white-space:nowrap}
.pill.warn{background:var(--warn2);color:var(--warn)}
.pill.gray{background:#eee;color:#666}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{font-size:13px;color:var(--mute);font-weight:600;background:#faf9f6}
.empty{padding:28px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0004}
.mbox h3{margin:0 0 12px;font-size:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;font-weight:600;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--warn)}
.banner{background:#fff7d6;border:1px solid #f0dc8c;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14.5px}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}nav{top:auto;position:static}}

.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stu{position:relative;padding:18px 8px;border-radius:16px;font-size:20px;font-weight:800;background:#fff;border:2px solid var(--line);text-align:center}
.stu small{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:2px}
.stu:hover{border-color:var(--pri);background:var(--pri2)}
.badge{position:absolute;top:6px;right:8px;font-size:12px;background:var(--pri);color:#fff;border-radius:99px;padding:1px 8px;font-weight:700}
.badge.late{background:var(--warn)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.book{text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;gap:10px;align-items:flex-start;min-height:74px}
.book:hover{border-color:var(--pri);background:var(--pri2)}
.book .ic{font-size:26px;line-height:1}
.book b{display:block;font-size:16px;line-height:1.3}
.book span{font-size:13px;color:var(--mute)}
.mine{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;flex-wrap:wrap}
.mine.late{border-color:#f1b394;background:var(--warn2)}
.mine .t{flex:1;min-width:180px}
.mine .t b{font-size:17px}
.big{font-size:18px;padding:12px 22px;border-radius:12px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.who h2{margin:0;font-size:26px}
.quick{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.quick input{flex:1;min-width:160px;font-size:17px}
tr.late td{background:#fff3ec}
.bars div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px}
.bars i{display:block;height:18px;background:var(--pri);border-radius:5px;min-width:3px}
.bars span.n{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:grid!important;grid-template-columns:repeat(4,1fr);gap:0}
#print div{border:1px dashed #999;padding:8px;height:26mm;font-size:11pt;overflow:hidden}#print b{font-size:18pt;display:block}}
</style>
</head>
<body>
<header>
  <h1>📚 학급문고 대출·반납</h1>
  <span class="sp"></span>
  <span class="sync" id="sync">…</span>
  <button class="sm ghost" id="lockBtn" style="color:#fff;border-color:#ffffff55" hidden>🔒 잠그기</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="print"></div>
<script>
const APP_NAME = '학급문고 대출·반납';
const SCHEMA = {
  students: [['no', '번호'], ['name', '이름']],
  books: [['id', '도서번호'], ['title', '제목'], ['author', '지은이'], ['status', '상태'], ['memo', '메모']],
  loans: [['lid', '기록번호'], ['bookId', '도서번호'], ['title', '제목'], ['no', '번호'], ['name', '이름'], ['out', '대출일'], ['due', '반납예정일'], ['back', '반납일']]
};
const SHEETNAMES = { students: '학생', books: '도서', loans: '대출기록' };
const MERGE_ACTIONS = [];

function addDays(ds, n) {
  const p = ds.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2] + Number(n || 0));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* 대출·반납 규칙 — 화면(체험 모드)과 구글 시트(Apps Script)가 같은 코드를 씁니다 */
function core(db, req, today) {
  const p = req.data || {}, dirty = {};
  const fail = m => { throw new Error(m); };
  const S = v => String(v == null ? '' : v).trim();
  const sortStu = () => db.students.sort((a, b) => (Number(a.no) || 999) - (Number(b.no) || 999) || a.name.localeCompare(b.name));
  const nextId = () => {
    let mx = 0; db.books.forEach(b => { const m = /^B?(\d+)$/i.exec(b.id); if (m) mx = Math.max(mx, Number(m[1])); });
    return 'B' + String(mx + 1).padStart(3, '0');
  };
  switch (req.action) {
    case 'getAll': break;
    case 'addStudents':
      (p.list || []).forEach(s => {
        const no = S(s.no), name = S(s.name); if (!name) return;
        const ex = db.students.find(x => no ? x.no === no : x.name === name);
        if (ex) ex.name = name; else db.students.push({ no, name });
      });
      sortStu(); dirty.students = 1; break;
    case 'delStudent': {
      if (db.loans.some(l => !l.back && l.no === S(p.no) && l.name === S(p.name))) fail('빌린 책이 있는 학생은 지울 수 없어요. 먼저 반납해 주세요.');
      db.students = db.students.filter(s => !(s.no === S(p.no) && s.name === S(p.name))); dirty.students = 1; break;
    }
    case 'addBooks':
      (p.list || []).forEach(b => {
        const title = S(b.title); if (!title) return;
        const id = S(b.id), ex = id && db.books.find(x => x.id === id);
        if (ex) { ex.title = title; if (S(b.author)) ex.author = S(b.author); return; }
        db.books.push({ id: id || nextId(), title, author: S(b.author), status: '대출가능', memo: S(b.memo) });
      });
      dirty.books = 1; break;
    case 'updateBook': {
      const b = db.books.find(x => x.id === S(p.id)) || fail('책을 찾지 못했어요.');
      if (p.title != null) { if (!S(p.title)) fail('제목을 입력해 주세요.'); b.title = S(p.title); }
      if (p.author != null) b.author = S(p.author);
      if (p.memo != null) b.memo = S(p.memo);
      if (p.status === '분실' || p.status === '보관') { if (b.status === '대출중') fail('대출 중인 책은 먼저 반납해 주세요.'); b.status = p.status; }
      if (p.status === '대출가능' && b.status !== '대출중') b.status = '대출가능';
      dirty.books = 1; break;
    }
    case 'delBook': {
      const b = db.books.find(x => x.id === S(p.id)) || fail('책을 찾지 못했어요.');
      if (b.status === '대출중') fail('대출 중인 책은 지울 수 없어요.');
      db.books = db.books.filter(x => x !== b); dirty.books = 1; break;
    }
    case 'borrow': {
      const b = db.books.find(x => x.id === S(p.bookId)) || fail('없는 도서번호예요.');
      if (b.status === '대출중') fail('『' + b.title + '』은(는) 이미 누가 빌려 갔어요.');
      if (b.status !== '대출가능') fail('『' + b.title + '』은(는) 지금 빌릴 수 없는 책이에요(' + b.status + ').');
      if (!db.students.some(s => s.no === S(p.no) && s.name === S(p.name))) fail('학생 명단에 없는 학생이에요.');
      const max = Number(p.max) || 0;
      const mine = db.loans.filter(l => !l.back && l.no === S(p.no) && l.name === S(p.name)).length;
      if (max && mine >= max) fail('한 사람이 ' + max + '권까지 빌릴 수 있어요. 먼저 반납해 주세요.');
      db.loans.push({ lid: 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), bookId: b.id, title: b.title, no: S(p.no), name: S(p.name), out: today, due: addDays(today, p.days || 7), back: '' });
      b.status = '대출중'; dirty.books = dirty.loans = 1; break;
    }
    case 'return': {
      const b = db.books.find(x => x.id === S(p.bookId)) || fail('없는 도서번호예요.');
      const l = db.loans.find(x => !x.back && x.bookId === b.id) || fail('『' + b.title + '』은(는) 빌려 간 기록이 없어요.');
      l.back = today; b.status = '대출가능'; dirty.books = dirty.loans = 1; break;
    }
    case 'extend': {
      const l = db.loans.find(x => x.lid === S(p.lid) && !x.back) || fail('대출 기록을 찾지 못했어요.');
      l.due = addDays(l.due > today ? l.due : today, p.days || 7); dirty.loans = 1; break;
    }
    default: fail('알 수 없는 요청: ' + req.action);
  }
  return { dirty: Object.keys(dirty) };
}

/* ===== 저장소: 구글 시트(GAS) 또는 이 기기(체험 모드) ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function emptyDb() { const d = {}; Object.keys(SCHEMA).forEach(k => d[k] = []); return d; }

const Store = {
  db: emptyDb(), q: [], busy: false, onChange: () => {}, onSync: () => {},
  cfg() { return LS.get(APP_KEY + '-cfg', { url: '', pw: '' }); },
  setCfg(c) { LS.set(APP_KEY + '-cfg', c); },
  remote() { return !!this.cfg().url; },
  async send(req) {
    const c = this.cfg();
    const res = await fetch(c.url, { method: 'POST', body: JSON.stringify(Object.assign({}, req, { pw: c.pw })) });
    let j; try { j = await res.json(); } catch (_) { throw new Error('응답을 읽지 못했어요. 배포 주소(/exec)와 액세스 권한(모든 사용자)을 확인해 주세요.'); }
    if (!j.ok) throw new Error(j.err || '알 수 없는 오류');
    return j;
  },
  async init() {
    if (!this.remote()) { this.db = Object.assign(emptyDb(), LS.get(APP_KEY + '-db', null) || (typeof DEMO !== 'undefined' ? DEMO() : {})); this.saveLocal(); this.onChange(); this.onSync('local'); return; }
    this.onSync('saving');
    try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); this.onSync('ok'); }
    catch (e) { this.onSync('err', e.message); throw e; }
    this.onChange();
  },
  saveLocal() { LS.set(APP_KEY + '-db', this.db); },
  /* 화면에 먼저 반영하고(바로 보임), 시트에는 순서대로 저장 */
  run(action, data) {
    const req = { action, data };
    const backup = clone(this.db);
    try { core(this.db, clone(req), todayStr()); }
    catch (e) { this.db = backup; toast('⚠️ ' + e.message, true); return false; }
    this.onChange();
    if (!this.remote()) { this.saveLocal(); return true; }
    this.q.push(req); this.pump(); return true;
  },
  async pump() {
    if (this.busy) return; this.busy = true; this.onSync('saving');
    while (this.q.length) {
      let req = this.q[0], n = 1;
      if (MERGE_ACTIONS.includes(req.action)) { // 연속 체크는 한 번에 모아서 저장
        while (n < this.q.length && this.q[n].action === req.action) n++;
        const list = [].concat(...this.q.slice(0, n).map(r => r.data.list));
        req = { action: req.action, data: { list } };
      }
      try {
        const r = await this.send(req);
        this.q.splice(0, n);
        if (!this.q.length) { this.db = Object.assign(emptyDb(), r.db); this.onChange(); }
      } catch (e) {
        this.q.length = 0; toast('⚠️ 저장 실패: ' + e.message, true);
        try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); } catch (_) {}
        this.onChange(); this.busy = false; this.onSync('err', e.message); return;
      }
    }
    this.busy = false; this.onSync('ok');
  },
  async refresh() {
    if (!this.remote() || this.busy || this.q.length) return;
    try { const r = await this.send({ action: 'getAll' }); if (!this.busy && !this.q.length) { this.db = Object.assign(emptyDb(), r.db); this.onChange(true); this.onSync('ok'); } } catch (_) {}
  }
};

let toastT;
function toast(msg, bad) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 4500 : 2200);
}
function modal(html, onMount) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="mbox">' + html + '</div>';
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  document.body.appendChild(m); if (onMount) onMount(m); return m;
}
function copyText(txt) {
  const done = () => toast('📋 복사했어요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) { toast('복사하지 못했어요', true); } ta.remove(); }
}
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

const APP_KEY = 'classlib';
function DEMO() {
  const names = ['김하늘', '이도윤', '박서연', '최지호', '정하린', '강민준'];
  const books = [['마당을 나온 암탉', '황선미'], ['나쁜 어린이 표', '황선미'], ['샬롯의 거미줄', 'E.B. 화이트'], ['책 먹는 여우', '프란치스카 비어만'], ['어린 왕자', '생텍쥐페리'], ['우리 반 똥배 장군', ''], ['수학 도둑', ''], ['내 멋대로 친구 뽑기', '최은옥']];
  return {
    students: names.map((n, i) => ({ no: String(i + 1), name: n })),
    books: books.map((b, i) => ({ id: 'B' + String(i + 1).padStart(3, '0'), title: b[0], author: b[1], status: '대출가능', memo: '' })),
    loans: []
  };
}
const OPT = () => Object.assign({ days: 7, max: 2, pin: '' }, LS.get(APP_KEY + '-opt', {}));
const TABS = [['desk', '🏫 대출·반납'], ['now', '📋 대출 현황'], ['books', '📚 도서 관리'], ['stu', '👧 학생'], ['stat', '📊 통계'], ['set', '⚙️ 설정']];
const UI = { tab: 'desk', who: null, q: '', bq: '', unlocked: false, histQ: '', from: '' };
const $ = s => document.querySelector(s);
const W = ['일', '월', '화', '수', '목', '금', '토'];
function md(ds) { if (!ds) return ''; const p = ds.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]); return p[1] + '/' + p[2] + '(' + W[d.getDay()] + ')'; }
function late(l) { return !l.back && l.due < todayStr(); }
function openLoans() { return Store.db.loans.filter(l => !l.back); }
function loansOf(s) { return openLoans().filter(l => l.no === s.no && l.name === s.name); }
function stuKey(s) { return s.no + '|' + s.name; }
function findStu(k) { return Store.db.students.find(s => stuKey(s) === k); }

function go(tab) {
  if (tab !== 'desk' && OPT().pin && !UI.unlocked) {
    return modal(`<h3>🔐 선생님 확인</h3><p class="muted">선생님 메뉴는 비밀번호가 있어야 열려요.</p><input id="pinIn" type="password" inputmode="numeric" style="width:100%;font-size:20px" autocomplete="off"><div class="row" style="margin-top:14px;justify-content:flex-end"><button data-close>취소</button><button class="btn" id="pinOk">열기</button></div>`, m => {
      const ok = () => { if (m.querySelector('#pinIn').value === OPT().pin) { UI.unlocked = true; m.remove(); go(tab); } else toast('비밀번호가 달라요', true); };
      m.querySelector('#pinOk').onclick = ok; m.querySelector('#pinIn').onkeydown = e => e.key === 'Enter' && ok(); setTimeout(() => m.querySelector('#pinIn').focus(), 50);
    });
  }
  UI.tab = tab; render();
}
function render(soft) {
  $('#nav').innerHTML = TABS.map(t => `<button data-tab="${t[0]}" aria-current="${UI.tab === t[0]}">${t[1]}</button>`).join('');
  $('#lockBtn').hidden = !(OPT().pin && UI.unlocked);
  if (soft && document.activeElement && document.activeElement.tagName === 'INPUT' && UI.tab !== 'desk') return; // 입력 중에는 새로고침으로 방해하지 않기
  const f = { desk: vDesk, now: vNow, books: vBooks, stu: vStu, stat: vStat, set: vSet }[UI.tab];
  const keep = document.activeElement && document.activeElement.id, pos = keep && document.activeElement.selectionStart;
  $('#main').innerHTML = (Store.remote() ? '' : `<div class="banner">🧪 <b>체험 모드</b> — 지금은 이 기기에만 저장돼요. 구글 시트에 연결하려면 <a href="#" onclick="go('set');return false">⚙️ 설정</a>에서 주소를 넣어 주세요.</div>`) + f();
  if (keep) { const el = document.getElementById(keep); if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} } }
}

/* ---------- 대출·반납 (학생용 화면) ---------- */
function vDesk() {
  const quick = `<div class="quick"><b>📕 빠른 반납</b><input id="qret" placeholder="도서번호(예: B003)를 입력하고 Enter" autocomplete="off"><button class="btn" onclick="quickReturn()">반납</button></div>`;
  const s = UI.who && findStu(UI.who);
  if (!s) {
    if (!Store.db.students.length) return quick + `<div class="card empty">학생 명단이 없어요. <b>👧 학생</b> 탭에서 먼저 등록해 주세요.</div>`;
    return quick + `<div class="card"><h2>누가 빌리거나 반납하나요? 내 이름을 눌러요 👇</h2><div class="stu-grid">${Store.db.students.map(s => {
      const ls = loansOf(s), lt = ls.some(late);
      return `<button class="stu" onclick="UI.who='${esc(stuKey(s))}';UI.q='';render()"><small>${esc(s.no)}번</small>${esc(s.name)}${ls.length ? `<span class="badge${lt ? ' late' : ''}">${lt ? '⏰ ' : ''}${ls.length}권</span>` : ''}</button>`;
    }).join('')}</div></div>`;
  }
  const mine = loansOf(s), o = OPT(), full = o.max && mine.length >= o.max;
  const q = UI.q.trim().toLowerCase();
  const avail = Store.db.books.filter(b => b.status === '대출가능' && (!q || (b.title + ' ' + b.author + ' ' + b.id).toLowerCase().includes(q)));
  return quick + `<div class="who"><button class="big" onclick="UI.who=null;render()">◀ 처음으로</button><h2>${esc(s.no)}번 ${esc(s.name)}</h2>${o.max ? `<span class="pill">${mine.length} / ${o.max}권 빌림</span>` : ''}</div>
  <div class="card"><h2>📕 내가 빌린 책</h2>${mine.length ? mine.map(l => `<div class="mine${late(l) ? ' late' : ''}"><div class="t"><b>${esc(l.title)}</b><div class="muted">${esc(l.bookId)} · ${md(l.out)}에 빌림 · 반납일 <b>${md(l.due)}</b> ${late(l) ? '<span class="pill warn">반납일 지남</span>' : ''}</div></div><button class="btn big" onclick="doReturn('${esc(l.bookId)}')">반납하기</button></div>`).join('') : '<p class="muted">빌린 책이 없어요.</p>'}</div>
  <div class="card"><h2>📗 빌릴 책 고르기 ${full ? '<span class="pill warn">더 빌리려면 먼저 반납해요</span>' : ''}</h2>
  <div class="row" style="margin-bottom:12px"><input id="bsearch" style="flex:1;font-size:17px" placeholder="🔍 책 제목, 지은이, 도서번호로 찾기" value="${esc(UI.q)}" oninput="UI.q=this.value;render()" autocomplete="off"></div>
  ${avail.length ? `<div class="book-grid">${avail.map(b => `<button class="book" ${full ? 'disabled' : ''} onclick="askBorrow('${esc(b.id)}')"><span class="ic">📘</span><div><b>${esc(b.title)}</b><span>${esc(b.author || '')} ${esc(b.id)}</span></div></button>`).join('')}</div>` : `<p class="muted">${q ? '찾는 책이 없거나 이미 누가 빌려 갔어요.' : '지금 빌릴 수 있는 책이 없어요.'}</p>`}</div>`;
}
function askBorrow(id) {
  const s = findStu(UI.who), b = Store.db.books.find(x => x.id === id); if (!s || !b) return;
  const due = addDays(todayStr(), OPT().days);
  modal(`<h3>📘 이 책을 빌릴까요?</h3><p style="font-size:20px;margin:6px 0"><b>${esc(b.title)}</b></p><p class="muted">${esc(s.name)} · 반납일 <b>${md(due)}</b>까지</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="big" data-close>아니요</button><button class="btn big" id="yes">빌릴게요!</button></div>`, m => {
    m.querySelector('#yes').onclick = () => { m.remove(); if (Store.run('borrow', { bookId: id, no: s.no, name: s.name, days: OPT().days, max: OPT().max })) { toast('✅ 『' + b.title + '』 빌렸어요! ' + md(due) + '까지 반납해요'); UI.who = null; UI.q = ''; render(); } };
  });
}
function doReturn(id) { const b = Store.db.books.find(x => x.id === id); if (Store.run('return', { bookId: id })) toast('📗 『' + (b ? b.title : id) + '』 반납했어요. 고마워요!'); }
function quickReturn() {
  const el = $('#qret'), v = el.value.trim(); if (!v) return;
  let b = Store.db.books.find(x => x.id.toLowerCase() === v.toLowerCase());
  if (!b && /^\d+$/.test(v)) b = Store.db.books.find(x => x.id.toLowerCase() === ('b' + v.padStart(3, '0')));
  if (!b) return toast('그런 도서번호가 없어요: ' + v, true);
  el.value = ''; doReturn(b.id);
}

/* ---------- 대출 현황 ---------- */
function vNow() {
  const ls = openLoans().sort((a, b) => a.due.localeCompare(b.due)), lt = ls.filter(late);
  const hq = UI.histQ.trim();
  const hist = Store.db.loans.filter(l => !hq || (l.name + l.title + l.no).includes(hq)).slice().reverse().slice(0, 300);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>지금 빌려 간 책 ${ls.length}권 ${lt.length ? `<span class="pill warn">반납일 지남 ${lt.length}권</span>` : ''}</h2>
  ${lt.length ? `<button class="sm" onclick="copyLate()">📋 연체 안내 문구 복사</button>` : ''}</div>
  ${ls.length ? `<table class="list"><tr><th>번호</th><th>이름</th><th>책</th><th>빌린 날</th><th>반납일</th><th></th></tr>${ls.map(l => `<tr class="${late(l) ? 'late' : ''}"><td>${esc(l.no)}</td><td><b>${esc(l.name)}</b></td><td>${esc(l.title)} <span class="muted">${esc(l.bookId)}</span></td><td>${md(l.out)}</td><td>${md(l.due)} ${late(l) ? '<span class="pill warn">지남</span>' : ''}</td><td style="white-space:nowrap"><button class="sm" onclick="Store.run('extend',{lid:'${esc(l.lid)}',days:OPT().days})&&toast('반납일을 연장했어요')">연장</button> <button class="sm btn" onclick="doReturn('${esc(l.bookId)}')">반납</button></td></tr>`).join('')}</table>` : '<div class="empty">빌려 간 책이 없어요.</div>'}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>📜 전체 대출 기록</h2><div class="row"><input id="histQ" placeholder="이름·책 제목 검색" value="${esc(UI.histQ)}" oninput="UI.histQ=this.value;render()"><button class="sm" onclick="exportLoans()">⬇️ CSV</button></div></div>
  ${hist.length ? `<table class="list"><tr><th>빌린 날</th><th>번호</th><th>이름</th><th>책</th><th>반납일</th><th>반납한 날</th></tr>${hist.map(l => `<tr><td>${md(l.out)}</td><td>${esc(l.no)}</td><td>${esc(l.name)}</td><td>${esc(l.title)}</td><td>${md(l.due)}</td><td>${l.back ? md(l.back) : '<span class="pill">대출 중</span>'}</td></tr>`).join('')}</table>` : '<div class="empty">기록이 없어요.</div>'}</div>`;
}
function copyLate() {
  const lt = openLoans().filter(late);
  copyText('📚 학급문고 반납 안내\n반납일이 지난 책이 있어요. 내일까지 가져와 주세요!\n' + lt.map(l => `- ${l.no}번 ${l.name}: 『${l.title}』 (반납일 ${md(l.due)})`).join('\n'));
}
function exportLoans() { downloadCSV('학급문고_대출기록_' + todayStr() + '.csv', [['도서번호', '제목', '번호', '이름', '대출일', '반납예정일', '반납일']].concat(Store.db.loans.map(l => [l.bookId, l.title, l.no, l.name, l.out, l.due, l.back]))); }

/* ---------- 도서 관리 ---------- */
function vBooks() {
  const q = UI.bq.trim().toLowerCase();
  const bs = Store.db.books.filter(b => !q || (b.id + b.title + b.author + b.memo).toLowerCase().includes(q));
  const who = id => { const l = openLoans().find(x => x.bookId === id); return l ? l.name : ''; };
  return `<div class="grid2"><div class="card"><h2>➕ 책 등록 (여러 권 한꺼번에)</h2>
  <p class="muted" style="margin:0 0 6px">한 줄에 한 권씩 적어요. <b>제목 / 지은이</b> 형식도 돼요.<br>엑셀에서 <b>도서번호·제목·지은이</b> 세 칸을 복사해 붙여 넣어도 돼요. 도서번호를 비우면 B001, B002…로 자동으로 붙여요.</p>
  <textarea id="bookPaste" placeholder="마당을 나온 암탉 / 황선미&#10;어린 왕자 / 생텍쥐페리&#10;책 먹는 여우"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addBooks()">등록하기</button></div></div>
  <div class="card"><h2>🏷️ 도서번호 라벨</h2><p class="muted">책 표지 안쪽이나 등에 붙일 라벨을 A4로 인쇄해요(한 장에 40칸). 학생들이 빠른 반납 칸에 번호를 입력하면 돼요.</p>
  <div class="row"><button onclick="printLabels(false)">🖨️ 전체 라벨 인쇄</button><button onclick="printLabels(true)">🖨️ 검색된 책만 인쇄</button></div>
  <p class="muted" style="margin-top:14px">책 ${Store.db.books.length}권 · 대출 중 ${openLoans().length}권 · 분실/보관 ${Store.db.books.filter(b => b.status === '분실' || b.status === '보관').length}권</p></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>📚 책 목록</h2><input id="bq" placeholder="🔍 검색" value="${esc(UI.bq)}" oninput="UI.bq=this.value;render()"></div>
  ${bs.length ? `<table class="list"><tr><th>도서번호</th><th>제목</th><th>지은이</th><th>상태</th><th>메모</th><th></th></tr>${bs.map(b => `<tr><td>${esc(b.id)}</td><td><b>${esc(b.title)}</b></td><td>${esc(b.author)}</td><td>${b.status === '대출중' ? `<span class="pill">대출 중 · ${esc(who(b.id))}</span>` : b.status === '대출가능' ? '<span class="pill gray">있음</span>' : `<span class="pill warn">${esc(b.status)}</span>`}</td><td class="muted">${esc(b.memo)}</td><td style="white-space:nowrap"><button class="sm" onclick="editBook('${esc(b.id)}')">수정</button></td></tr>`).join('')}</table>` : '<div class="empty">등록된 책이 없어요.</div>'}</div>`;
}
function parseLines(txt) { return txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
function addBooks() {
  const list = parseLines($('#bookPaste').value).map(line => {
    if (line.includes('\t')) { const c = line.split('\t').map(s => s.trim()); return c.length >= 3 ? { id: c[0], title: c[1], author: c[2] } : { title: c[0], author: c[1] || '' }; }
    const c = line.split(/\s+\/\s+|\s*\/\s*/); return { title: c[0], author: c.slice(1).join(' / ') };
  });
  if (!list.length) return toast('등록할 책을 적어 주세요', true);
  if (Store.run('addBooks', { list })) toast('📚 ' + list.length + '권 등록했어요');
}
function editBook(id) {
  const b = Store.db.books.find(x => x.id === id); if (!b) return;
  modal(`<h3>✏️ 책 정보 수정 <span class="muted">${esc(b.id)}</span></h3>
  <label class="f">제목</label><input id="eT" style="width:100%" value="${esc(b.title)}"><label class="f">지은이</label><input id="eA" style="width:100%" value="${esc(b.author)}"><label class="f">메모 (예: 표지 찢어짐)</label><input id="eM" style="width:100%" value="${esc(b.memo)}">
  <label class="f">상태</label><select id="eS" ${b.status === '대출중' ? 'disabled' : ''}>${['대출가능', '보관', '분실'].concat(b.status === '대출중' ? ['대출중'] : []).map(s => `<option ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}</select> <span class="muted">보관·분실로 두면 학생 화면에 안 보여요.</span>
  <div class="row" style="justify-content:space-between;margin-top:18px"><button class="danger" id="eD">🗑 삭제</button><div class="row"><button data-close>취소</button><button class="btn" id="eOk">저장</button></div></div>`, m => {
    m.querySelector('#eOk').onclick = () => { if (Store.run('updateBook', { id, title: m.querySelector('#eT').value, author: m.querySelector('#eA').value, memo: m.querySelector('#eM').value, status: b.status === '대출중' ? undefined : m.querySelector('#eS').value })) { m.remove(); toast('저장했어요'); } };
    m.querySelector('#eD').onclick = () => { if (confirm('『' + b.title + '』을(를) 목록에서 지울까요? (대출 기록은 남아요)') && Store.run('delBook', { id })) { m.remove(); toast('지웠어요'); } };
  });
}
function printLabels(onlyFiltered) {
  const q = UI.bq.trim().toLowerCase();
  const bs = Store.db.books.filter(b => !onlyFiltered || !q || (b.id + b.title + b.author).toLowerCase().includes(q));
  if (!bs.length) return toast('인쇄할 책이 없어요', true);
  $('#print').innerHTML = bs.map(b => `<div><b>${esc(b.id)}</b>${esc(b.title)}</div>`).join('');
  window.print();
}

/* ---------- 학생 ---------- */
function vStu() {
  const cnt = s => Store.db.loans.filter(l => l.no === s.no && l.name === s.name).length;
  return `<div class="grid2"><div class="card"><h2>➕ 학생 등록</h2><p class="muted" style="margin:0 0 6px">한 줄에 한 명씩 <b>번호 이름</b>으로 적어요. 엑셀에서 두 칸을 복사해 붙여 넣어도 돼요. 같은 번호가 있으면 이름을 고쳐요.</p>
  <textarea id="stuPaste" placeholder="1 김하늘&#10;2 이도윤&#10;3 박서연"></textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addStu()">등록하기</button></div></div>
  <div class="card"><h2>👧 학생 명단 (${Store.db.students.length}명)</h2>${Store.db.students.length ? `<table class="list"><tr><th>번호</th><th>이름</th><th>지금까지 빌린 책</th><th></th></tr>${Store.db.students.map(s => `<tr><td>${esc(s.no)}</td><td><b>${esc(s.name)}</b></td><td>${cnt(s)}권</td><td><button class="sm danger" onclick="confirm('${esc(s.name)} 학생을 명단에서 지울까요?')&&Store.run('delStudent',{no:'${esc(s.no)}',name:'${esc(s.name)}'})">지우기</button></td></tr>`).join('')}</table>` : '<div class="empty">아직 학생이 없어요.</div>'}</div></div>`;
}
function addStu() {
  const list = parseLines($('#stuPaste').value).map(line => { const c = line.split(/[\t,]+|\s+/).filter(Boolean); return /^\d+$/.test(c[0]) ? { no: c[0], name: c.slice(1).join(' ') } : { no: '', name: c.join(' ') }; }).filter(s => s.name);
  if (!list.length) return toast('학생을 적어 주세요', true);
  if (Store.run('addStudents', { list })) toast('👧 ' + list.length + '명 등록했어요');
}

/* ---------- 통계 ---------- */
function vStat() {
  if (!UI.from) { const t = new Date(); UI.from = (t.getMonth() + 1 >= 3 ? t.getFullYear() : t.getFullYear() - 1) + '-03-01'; }
  const ls = Store.db.loans.filter(l => l.out >= UI.from);
  const tally = key => { const m = {}; ls.forEach(l => { const k = key(l); m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const bars = (arr, lab) => { const mx = arr.length ? arr[0][1] : 1; return arr.length ? `<div class="bars">${arr.slice(0, 15).map(([k, v]) => `<div><span class="n">${esc(lab(k))}</span><i style="width:${Math.max(2, v / mx * 60)}%"></i><b>${v}</b></div>`).join('')}</div>` : '<div class="empty">기록이 없어요.</div>'; };
  const byStu = Store.db.students.map(s => [stuKey(s), ls.filter(l => l.no === s.no && l.name === s.name).length]).sort((a, b) => b[1] - a[1]);
  const byMonth = tally(l => l.out.slice(0, 7)).sort((a, b) => a[0].localeCompare(b[0]));
  return `<div class="card row"><b>기간</b><input type="date" value="${UI.from}" onchange="UI.from=this.value;render()"> 부터 오늘까지 · 대출 <b>${ls.length}</b>건 <span class="sp" style="flex:1"></span><button class="sm" onclick="copyReaders()">📋 독서왕 명단 복사</button></div>
  <div class="grid2"><div class="card"><h2>🏆 많이 읽은 친구</h2>${bars(byStu, k => { const s = findStu(k); return s ? s.no + '번 ' + s.name : k; })}</div>
  <div class="card"><h2>⭐ 인기 있는 책</h2>${bars(tally(l => l.title), k => k)}</div></div>
  <div class="card"><h2>📅 월별 대출</h2>${bars(byMonth, k => k.replace('-', '년 ') + '월')}</div>`;
}
function copyReaders() {
  const ls = Store.db.loans.filter(l => l.out >= UI.from);
  const arr = Store.db.students.map(s => [s, ls.filter(l => l.no === s.no && l.name === s.name).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  copyText('📚 학급문고 독서 기록 (' + md(UI.from) + '~)\n' + arr.map((x, i) => `${i + 1}. ${x[0].no}번 ${x[0].name} — ${x[1]}권`).join('\n'));
}

/* ---------- 설정 ---------- */
function vSet() {
  const c = Store.cfg(), o = OPT();
  return `<div class="grid2"><div class="card"><h2>🔗 구글 시트 연결</h2>
  <label class="f">Apps Script 웹 앱 주소 (…/exec 로 끝나요)</label><input id="sUrl" style="width:100%" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="f">연결 비밀번호 (Code.gs 맨 위 PASSWORD와 같게)</label><input id="sPw" type="password" style="width:100%" value="${esc(c.pw)}">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveConn()">저장하고 연결</button>${c.url ? '<button onclick="disconnect()">연결 끊기(체험 모드)</button>' : ''}</div>
  <p class="muted">이 주소와 비밀번호는 이 기기 브라우저에만 저장돼요. 대출용 태블릿과 선생님 컴퓨터에 각각 한 번씩 넣어 주세요.</p>
  ${!c.url ? `<p class="muted">체험 모드에서 쓰던 자료를 시트로 옮기려면: 연결한 뒤 <b>도서 관리·학생</b> 탭에 다시 붙여 넣어 주세요.</p>` : ''}</div>
  <div class="card"><h2>📏 대출 규칙 <span class="muted">(이 기기)</span></h2>
  <label class="f">대출 기간 (일)</label><input id="oD" type="number" min="1" max="60" value="${o.days}">
  <label class="f">한 사람이 빌릴 수 있는 권수 (0 = 제한 없음)</label><input id="oM" type="number" min="0" max="20" value="${o.max}">
  <label class="f">선생님 메뉴 비밀번호 (비우면 잠금 없음)</label><input id="oP" type="password" inputmode="numeric" value="${esc(o.pin)}" autocomplete="new-password">
  <p class="muted">비밀번호를 넣으면 학생은 <b>대출·반납</b> 화면만 쓸 수 있어요.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="saveOpt()">저장</button></div></div></div>
  ${!c.url ? `<div class="card"><h2>🧪 체험 자료</h2><button class="danger" onclick="if(confirm('이 기기의 체험 자료를 모두 지우고 예시로 되돌릴까요?')){LS.set(APP_KEY+'-db',null);Store.init()}">체험 자료 초기화</button></div>` : ''}`;
}
async function saveConn() {
  const url = $('#sUrl').value.trim(), pw = $('#sPw').value;
  if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('주소는 https://script.google.com/… /exec 형태여야 해요', true);
  Store.setCfg({ url, pw });
  try { await Store.init(); toast('✅ 구글 시트에 연결했어요'); UI.tab = 'desk'; render(); } catch (e) { toast('연결 실패: ' + e.message, true); }
}
function disconnect() { Store.setCfg({ url: '', pw: '' }); Store.init(); toast('체험 모드로 바꿨어요'); }
function saveOpt() {
  const o = { days: Math.max(1, Number($('#oD').value) || 7), max: Math.max(0, Number($('#oM').value) || 0), pin: $('#oP').value.trim() };
  LS.set(APP_KEY + '-opt', o); if (o.pin) UI.unlocked = true; toast('저장했어요'); render();
}

/* ---------- 시작 ---------- */
document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'qret') quickReturn(); });
$('#lockBtn').onclick = () => { UI.unlocked = false; UI.tab = 'desk'; render(); toast('🔒 잠갔어요'); };
Store.onChange = soft => render(soft);
Store.onSync = (s, m) => { const el = $('#sync'); el.className = 'sync' + (s === 'err' ? ' err' : ''); el.textContent = s === 'local' ? '🧪 체험 모드' : s === 'saving' ? '⏳ 저장 중…' : s === 'ok' ? '✅ 시트와 연결됨' : '⚠️ 연결 문제'; el.title = m || ''; };
Store.init().catch(() => { UI.tab = 'set'; render(); });
setInterval(() => { if (!document.querySelector('.modal')) Store.refresh(); }, 30000);
let idleT; ['click', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(idleT); idleT = setTimeout(() => { if (UI.tab === 'desk' && UI.who && !document.querySelector('.modal')) { UI.who = null; UI.q = ''; render(); } }, 90000); }));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가정통신문 회신 대장</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
*{box-sizing:border-box}
:root{--paper:#FFFFFF;--desk:#F2F3F5;--ink:#1B2A4E;--ink2:#46506A;--mute:#8B93A7;--rule:#D9DEE8;--rule2:#EDF0F5;
--red:#C2362C;--red2:#FBEDEB;--blue:#2A4E9C;--blue2:#E9EFFA;--green:#4C6B4A;--ok:#2E7D5B;
--sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:8px 14px;font-weight:600}
button:hover{border-color:var(--ink2)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.btn{background:var(--ink);border-color:var(--ink);color:#fff}.btn:hover{background:#253867}
.sm{padding:4px 10px;font-size:13px}
.danger{color:var(--red)}
input,select,textarea{border:1px solid var(--rule);border-radius:4px;padding:8px 11px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.6}
a{color:var(--blue)}
/* 왼쪽 서류철 메뉴 */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--ink);color:#C9D1E6;padding:26px 0 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-size:15px;font-weight:700;color:#fff;margin:0 22px 26px;line-height:1.35;letter-spacing:-.2px}
aside h1 small{display:block;font-size:12px;font-weight:500;color:#8E9AB9;margin-top:3px}
aside .seal{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid #E0675D;color:#E0675D;border-radius:50%;font-size:12px;font-weight:800;transform:rotate(-10deg);margin-bottom:14px}
#nav{display:flex;flex-direction:column}
#nav button{border:none;border-radius:0;background:transparent;color:#AEB8D3;text-align:left;padding:11px 22px;font-weight:600;border-left:3px solid transparent}
#nav button:hover{color:#fff;background:rgba(255,255,255,.04)}
#nav button[aria-current=true]{color:#fff;background:rgba(255,255,255,.08);border-left-color:#E0675D}
aside .foot{margin-top:auto;padding:0 22px;display:flex;flex-direction:column;gap:10px}
aside select{background:#26375F;border-color:#3A4C78;color:#fff;width:100%}
.sync{font-size:12px;color:#8E9AB9}
main{padding:34px 40px 60px;max-width:1180px;width:100%;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.pagehead h2{font-size:24px;margin:0;letter-spacing:-.5px}
.pagehead p{margin:4px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 0 var(--rule)}
.card h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute);font-size:13.5px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--rule);border-radius:3px;color:var(--ink2);font-weight:600;white-space:nowrap;vertical-align:middle;background:#fff}
.pill.warn{border-color:#EDB7B1;color:var(--red);background:var(--red2)}
.pill.gray{color:var(--mute)}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:10px 12px;border-bottom:1px solid var(--rule2);text-align:left}
table.list th{font-size:12.5px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--rule)}
.empty{padding:34px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(27,42,78,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:3px;padding:26px 28px;max-width:560px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--ink);box-shadow:0 24px 60px -18px rgba(27,42,78,.5)}
.mbox h3{margin:0 0 14px;font-size:19px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:4px;opacity:0;transition:.2s;z-index:200;pointer-events:none;font-weight:600;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}
.banner{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--blue);padding:12px 16px;margin-bottom:20px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 14px;background:#fff}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
/* 통신문 선택: 서류 탭 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:8px 12px 8px 30px;position:relative;font-weight:600;text-align:left}
.chip::before{content:"";position:absolute;left:10px;top:50%;width:12px;height:12px;margin-top:-6px;border:1.5px solid var(--mute);border-radius:2px}
.chip[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.chip[aria-pressed=true]::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.chip.plain{padding-left:12px}.chip.plain::before{display:none}
/* 회신 대장(표) */
.board{overflow:auto;max-height:calc(100vh - 230px);background:#fff;border:1px solid var(--ink)}
.board table{border-collapse:separate;border-spacing:0;min-width:100%}
.board th,.board td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule2);padding:0;text-align:center;white-space:nowrap}
.board thead th{position:sticky;background:#fff;z-index:2;padding:8px 12px}
.board thead tr:first-child th{top:0;height:42px;font-size:14px;border-bottom:1px solid var(--ink)}
.board thead tr:nth-child(2) th{top:42px;font-size:13px;font-weight:600;color:var(--ink2);border-bottom:2px solid var(--ink)}
.board th.gs,.board td.gs{border-left:1px solid var(--ink)}
.board .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 14px;font-weight:600;min-width:118px;border-right:1px solid var(--ink)}
.board thead .nm{z-index:3}
.board tbody tr:nth-child(even) td{background:#FAFBFD}
.board tbody tr:nth-child(even) td.nm{background:#FAFBFD}
.board tfoot td{position:sticky;bottom:0;background:#fff;font-size:12.5px;font-weight:700;padding:7px;border-top:2px solid var(--ink);z-index:1}
.board tfoot td.nm{z-index:3}
.cell{border:none;border-radius:0;width:100%;min-width:78px;height:50px;background:transparent;padding:0}
.cell:hover{background:var(--blue2)}
.stamp{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.2px currentColor;font-size:12px;font-weight:800;letter-spacing:-.5px;transform:rotate(-12deg);opacity:.9;color:var(--red);line-height:1.05;text-align:center}
.stamp.c2{color:var(--blue)}.stamp.c3{color:var(--green)}
.stamp.long{font-size:10.5px}
.stamp.new{animation:press .28s cubic-bezier(.2,1.6,.5,1)}
@keyframes press{from{transform:rotate(-12deg) scale(1.6);opacity:0}}
.na{color:#C5CBD6;font-size:13px}
.left{font-size:12.5px;color:var(--red);font-weight:700;padding:0 12px}
.left.done{color:var(--ok)}
.allbtn{display:block;margin:4px auto 0;font-size:11px;padding:1px 7px}
.optlab{font-size:11px;color:var(--mute);font-weight:500;margin-top:2px}
/* 학생별 */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stu{position:relative;text-align:left;padding:14px 16px;border-radius:3px;background:#fff;border:1px solid var(--rule);min-height:84px}
.stu:hover{border-color:var(--ink)}
.stu small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.stu b{font-size:18px}
.stu .badge{display:block;font-size:12px;color:var(--red);margin-top:4px}
.stu.done .badge{color:var(--ok)}
.stu.done .stamp{position:absolute;right:10px;top:12px;width:34px;height:34px;font-size:10.5px}
.pnote{border-top:1px solid var(--rule);padding:14px 0 4px}
.pnote h4{margin:0 0 6px;font-size:15px}
.pit{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.pit .lb{min-width:120px;color:var(--ink2);font-weight:600}
.tog{min-width:84px;padding:9px 14px}
.tog[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.tog.o2[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.tog.o3[aria-pressed=true]{background:var(--green);border-color:var(--green)}
.pop{position:fixed;z-index:120;background:#fff;border:1px solid var(--ink);border-radius:3px;box-shadow:0 12px 30px -10px rgba(27,42,78,.4);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:140px}
.pop button{text-align:left}
/* 미제출 */
.prog{height:6px;background:var(--rule2);margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--ink)}
.miss{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.miss span{border:1px solid #EDB7B1;color:var(--red);border-radius:3px;padding:2px 8px;font-size:13px;font-weight:600;background:var(--red2)}
.itrow{display:grid;grid-template-columns:1fr 140px 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px 0 0}aside h1{margin:0 16px 10px}aside .seal{display:none}#nav{flex-direction:row;overflow-x:auto}#nav button{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}#nav button[aria-current=true]{border-bottom-color:#E0675D}aside .foot{flex-direction:row;padding:10px 16px}main{padding:20px 16px}.grid2,.itrow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1><span class="seal" aria-hidden="true">확인</span><br>가정통신문<br>회신 대장<small>여러 장을 한 번에 받아도 항목별로</small></h1>
  <div id="nav"></div>
  <div class="foot"><select id="clsSel" hidden></select><span class="sync" id="sync"></span></div>
</aside>
<main id="main"></main>
</div>
<script>
const APP_NAME = '가정통신문 회신 체크';
const SCHEMA = {
  students: [['cls', '학급'], ['no', '번호'], ['name', '이름']],
  notices: [['nid', '통신문ID'], ['title', '제목'], ['due', '회신마감'], ['target', '대상학급'], ['state', '상태'], ['made', '등록일']],
  items: [['iid', '항목ID'], ['nid', '통신문ID'], ['label', '항목'], ['type', '유형'], ['opts', '선택지'], ['ord', '순서']],
  resps: [['iid', '항목ID'], ['cls', '학급'], ['no', '번호'], ['name', '이름'], ['val', '응답'], ['at', '기록일']]
};
const SHEETNAMES = { students: '학생', notices: '통신문', items: '회신항목', resps: '회신기록' };
const MERGE_ACTIONS = ['setResps'];

/* 회신 규칙
   유형: check = 냈는지만 체크 / choice = 선택지 중 하나(동의·비동의, 참가·불참 등) */
function core(db, req, today) {
  const p = req.data || {}, dirty = {};
  const fail = m => { throw new Error(m); };
  const S = v => String(v == null ? '' : v).trim();
  const uid = pre => pre + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  switch (req.action) {
    case 'getAll': break;
    case 'addStudents':
      (p.list || []).forEach(s => {
        const cls = S(s.cls), no = S(s.no), name = S(s.name); if (!name || !no) return;
        const ex = db.students.find(x => x.cls === cls && x.no === no);
        if (ex) ex.name = name; else db.students.push({ cls, no, name });
      });
      db.students.sort((a, b) => a.cls.localeCompare(b.cls, 'ko', { numeric: true }) || (Number(a.no) - Number(b.no)));
      dirty.students = 1; break;
    case 'delStudent':
      db.students = db.students.filter(s => !(s.cls === S(p.cls) && s.no === S(p.no)));
      dirty.students = 1; break;
    case 'saveNotice': {
      const title = S(p.title); if (!title) fail('통신문 제목을 입력해 주세요.');
      const items = (p.items || []).filter(i => S(i.label));
      if (!items.length) fail('회신 항목을 하나 이상 넣어 주세요.');
      items.forEach(i => { if (i.type === 'choice' && S(i.opts).split(',').map(S).filter(Boolean).length < 2) fail('「' + S(i.label) + '」 선택지를 두 개 이상 쉼표로 적어 주세요.'); });
      let n = p.nid && db.notices.find(x => x.nid === S(p.nid));
      if (!n) { n = { nid: uid('N'), state: '진행', made: today }; db.notices.push(n); }
      n.title = title; n.due = S(p.due); n.target = S(p.target);
      const keep = {};
      items.forEach((it, k) => {
        let iid = S(it.iid), ex = iid && db.items.find(x => x.iid === iid && x.nid === n.nid);
        if (!ex) { iid = uid('I'); ex = { iid, nid: n.nid }; db.items.push(ex); }
        ex.label = S(it.label); ex.type = it.type === 'choice' ? 'choice' : 'check';
        ex.opts = ex.type === 'choice' ? S(it.opts).split(',').map(S).filter(Boolean).join(',') : '';
        ex.ord = String(k + 1); keep[iid] = 1;
      });
      const gone = db.items.filter(x => x.nid === n.nid && !keep[x.iid]).map(x => x.iid);
      db.items = db.items.filter(x => !gone.includes(x.iid));
      db.resps = db.resps.filter(r => !gone.includes(r.iid));
      dirty.notices = dirty.items = dirty.resps = 1; break;
    }
    case 'setState': {
      const n = db.notices.find(x => x.nid === S(p.nid)) || fail('통신문을 찾지 못했어요.');
      n.state = p.state === '완료' ? '완료' : '진행'; dirty.notices = 1; break;
    }
    case 'delNotice': {
      const ids = db.items.filter(x => x.nid === S(p.nid)).map(x => x.iid);
      db.notices = db.notices.filter(x => x.nid !== S(p.nid));
      db.items = db.items.filter(x => x.nid !== S(p.nid));
      db.resps = db.resps.filter(r => !ids.includes(r.iid));
      dirty.notices = dirty.items = dirty.resps = 1; break;
    }
    case 'setResps':
      (p.list || []).forEach(r => {
        const iid = S(r.iid), cls = S(r.cls), no = S(r.no), val = S(r.val);
        const it = db.items.find(x => x.iid === iid); if (!it) return; // 지워진 항목은 건너뜀
        const i = db.resps.findIndex(x => x.iid === iid && x.cls === cls && x.no === no);
        if (!val) { if (i >= 0) db.resps.splice(i, 1); return; }
        if (it.type === 'choice' && !it.opts.split(',').includes(val)) return;
        if (i >= 0) { db.resps[i].val = val; db.resps[i].name = S(r.name); db.resps[i].at = today; }
        else db.resps.push({ iid, cls, no, name: S(r.name), val, at: today });
      });
      dirty.resps = 1; break;
    case 'restore': {
      Object.keys(SCHEMA).forEach(k => { db[k] = (p.db && Array.isArray(p.db[k]) ? p.db[k] : []).map(r => { const o = {}; SCHEMA[k].forEach(c => o[c[0]] = S(r[c[0]])); return o; }); dirty[k] = 1; });
      break;
    }
    default: fail('알 수 없는 요청: ' + req.action);
  }
  return { dirty: Object.keys(dirty) };
}

/* ===== 저장소: 구글 시트(GAS) 또는 이 기기(체험 모드) ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function emptyDb() { const d = {}; Object.keys(SCHEMA).forEach(k => d[k] = []); return d; }

const Store = {
  db: emptyDb(), q: [], busy: false, onChange: () => {}, onSync: () => {},
  cfg() { return LS.get(APP_KEY + '-cfg', { url: '', pw: '' }); },
  setCfg(c) { LS.set(APP_KEY + '-cfg', c); },
  remote() { return !!this.cfg().url; },
  async send(req) {
    const c = this.cfg();
    const res = await fetch(c.url, { method: 'POST', body: JSON.stringify(Object.assign({}, req, { pw: c.pw })) });
    let j; try { j = await res.json(); } catch (_) { throw new Error('응답을 읽지 못했어요. 배포 주소(/exec)와 액세스 권한(모든 사용자)을 확인해 주세요.'); }
    if (!j.ok) throw new Error(j.err || '알 수 없는 오류');
    return j;
  },
  async init() {
    if (!this.remote()) { this.db = Object.assign(emptyDb(), LS.get(APP_KEY + '-db', null) || (typeof DEMO !== 'undefined' ? DEMO() : {})); this.saveLocal(); this.onChange(); this.onSync('local'); return; }
    this.onSync('saving');
    try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); this.onSync('ok'); }
    catch (e) { this.onSync('err', e.message); throw e; }
    this.onChange();
  },
  saveLocal() { LS.set(APP_KEY + '-db', this.db); },
  /* 화면에 먼저 반영하고(바로 보임), 시트에는 순서대로 저장 */
  run(action, data) {
    const req = { action, data };
    const backup = clone(this.db);
    try { core(this.db, clone(req), todayStr()); }
    catch (e) { this.db = backup; toast('⚠️ ' + e.message, true); return false; }
    this.onChange();
    if (!this.remote()) { this.saveLocal(); return true; }
    this.q.push(req); this.pump(); return true;
  },
  async pump() {
    if (this.busy) return; this.busy = true; this.onSync('saving');
    while (this.q.length) {
      let req = this.q[0], n = 1;
      if (MERGE_ACTIONS.includes(req.action)) { // 연속 체크는 한 번에 모아서 저장
        while (n < this.q.length && this.q[n].action === req.action) n++;
        const list = [].concat(...this.q.slice(0, n).map(r => r.data.list));
        req = { action: req.action, data: { list } };
      }
      try {
        const r = await this.send(req);
        this.q.splice(0, n);
        if (!this.q.length) { this.db = Object.assign(emptyDb(), r.db); this.onChange(); }
      } catch (e) {
        this.q.length = 0; toast('⚠️ 저장 실패: ' + e.message, true);
        try { this.db = Object.assign(emptyDb(), (await this.send({ action: 'getAll' })).db); } catch (_) {}
        this.onChange(); this.busy = false; this.onSync('err', e.message); return;
      }
    }
    this.busy = false; this.onSync('ok');
  },
  async refresh() {
    if (!this.remote() || this.busy || this.q.length) return;

  const lines = DB().students.filter(s => !UI.cls || s.cls === UI.cls).map(s => [s, a.filter(n => isTarget(n, s) && itemsOf(n.nid).some(it => !val(it, s)))]).filter(x => x[1].length)
    .map(([s, ns]) => `- ${sname(s)}: ${ns.map(n => n.title).join(', ')}`);
  copyText(lines.length ? '가정통신문 회신을 아직 내지 않은 친구들이에요. 내일까지 꼭 가져와 주세요!\n' + lines.join('\n') : '모두 냈어요!');
}
function copyNotice(nid) {
  const n = DB().notices.find(x => x.nid === nid), d = missingData(n);
  const miss = d.t.filter(s => !d.done.includes(s)).map(s => { const m = d.its.filter(it => !val(it, s)); return `- ${sname(s)}${m.length < d.its.length ? ' (' + m.map(it => it.label).join(', ') + ')' : ''}`; });
  copyText(`「${n.title}」${n.due ? ' (' + md(n.due) + ' 마감)' : ''} 회신 미제출\n` + (miss.length ? miss.join('\n') : '모두 냈어요!'));
}
function csvNotice(nid) {
  const n = DB().notices.find(x => x.nid === nid), its = itemsOf(nid), t = DB().students.filter(s => isTarget(n, s));
  downloadCSV(n.title.replace(/[\\/:*?"<>|]/g, '') + '_회신결과.csv', [['학급', '번호', '이름'].concat(its.map(i => i.label))].concat(t.map(s => [s.cls, s.no, s.name].concat(its.map(it => val(it, s))))));
}

/* ---------- 통신문 관리 ---------- */
function vNotice() {
  const all = DB().notices.slice().sort((a, b) => (b.made || '').localeCompare(a.made || '')), list = all.filter(n => UI.showDone || n.state !== '완료');
  const nDone = all.filter(n => n.state === '완료').length;
  return PH('통신문 등록', '통신문 하나에 회신 받을 것이 여러 개면 항목을 나눠 등록해요.', `<button class="btn" onclick="editNotice()">새 통신문 등록</button>`) + `<div class="row" style="justify-content:flex-end;margin-bottom:10px">
  ${nDone ? `<label class="row muted"><input type="checkbox" ${UI.showDone ? 'checked' : ''} onchange="UI.showDone=this.checked;render()"> 완료된 통신문도 보기 (${nDone})</label>` : ''}</div>
  ${list.length ? list.map(n => { const d = missingData(n);
    return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0 0 4px">${esc(n.title)} ${n.state === '완료' ? '<span class="pill gray">완료</span>' : dday(n.due)}</h2>
    <div class="muted">${n.due ? md(n.due) + ' 마감 · ' : ''}대상 ${esc(n.target ? n.target.replace(/,/g, ', ') : '전체')} · 항목 ${d.its.map(i => esc(i.label) + (i.type === 'choice' ? '(' + esc(i.opts.replace(/,/g, '/')) + ')' : '')).join(', ')} · 다 낸 학생 ${d.done.length}/${d.t.length}</div></div>
    <div class="row"><button class="sm" onclick="editNotice('${n.nid}')">수정</button><button class="sm" onclick="csvNotice('${n.nid}')">CSV</button>
    <button class="sm" onclick="Store.run('setState',{nid:'${n.nid}',state:'${n.state === '완료' ? '진행' : '완료'}'})">${n.state === '완료' ? '다시 받기' : '완료 처리'}</button>
    <button class="sm danger" onclick="confirm('「${esc(n.title)}」과 회신 기록을 모두 지울까요?')&&Store.run('delNotice',{nid:'${n.nid}'})">삭제</button></div></div></div>`; }).join('') : '<div class="card empty">등록된 통신문이 없어요.</div>'}
  <p class="muted">회신을 다 받은 통신문은 <b>완료 처리</b>하면 체크 화면에서 빠지고 기록은 남아요.</p>`;
}
const PRESET = { check: ['회신서 제출', 'check', ''], agree: ['동의 여부', 'choice', '동의,비동의'], join: ['참가 여부', 'choice', '참가,불참'], apply: ['신청 여부', 'choice', '신청,미신청'] };
function editNotice(nid) {
  const n = nid ? DB().notices.find(x => x.nid === nid) : null;
  let items = n ? itemsOf(nid).map(i => ({ iid: i.iid, label: i.label, type: i.type, opts: i.opts })) : [{ label: '회신서 제출', type: 'check', opts: '' }];
  const cs = classes(), tg = n && n.target ? n.target.split(',') : [];
  const m = modal(`<h3>${n ? '통신문 수정' : '새 통신문'}</h3>
  <label class="f">제목</label><input id="nT" style="width:100%" value="${esc(n ? n.title : '')}" placeholder="예: 겨울 현장체험학습 참가 동의서">
  <label class="f">회신 마감일</label><input id="nD" type="date" value="${esc(n ? n.due : '')}">
  ${cs.length > 1 ? `<label class="f">대상 학급 (아무것도 안 고르면 전체)</label><div class="chips" id="nC">${cs.map(c => `<button class="chip" aria-pressed="${tg.includes(c)}" data-c="${esc(c)}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">${esc(c)}</button>`).join('')}</div>` : ''}
  <label class="f">회신 항목 <span style="font-weight:400">— 한 통신문에 체크할 것이 여러 개면 항목을 나눠요</span></label><div id="its"></div>
  <div class="row" style="margin-top:6px"><span class="muted">빠르게 추가:</span>${Object.entries(PRESET).map(([k, p]) => `<button class="sm" data-p="${k}">+ ${p[0]}${p[2] ? ' (' + p[2].replace(',', '/') + ')' : ''}</button>`).join('')}<button class="sm" data-p="">+ 직접 입력</button></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button data-close>취소</button><button class="btn" id="nOk">저장</button></div>`);
  m.querySelector('.mbox').style.maxWidth = '720px';
  const draw = () => {
    m.querySelector('#its').innerHTML = items.map((it, i) => `<div class="itrow"><input data-k="label" data-i="${i}" value="${esc(it.label)}" placeholder="항목 이름 (예: 사진 촬영 동의)">
    <select data-k="type" data-i="${i}"><option value="check" ${it.type === 'check' ? 'selected' : ''}>냈는지만 체크</option><option value="choice" ${it.type === 'choice' ? 'selected' : ''}>선택형</option></select>
    <input data-k="opts" data-i="${i}" value="${esc(it.opts)}" placeholder="선택지를 쉼표로 (예: 동의,비동의)" ${it.type === 'choice' ? '' : 'disabled style="visibility:hidden"'}>
    <div class="row" style="flex-wrap:nowrap"><button class="sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button class="sm danger" data-del="${i}">✕</button></div></div>`).join('') || '<p class="muted">항목을 추가해 주세요.</p>';
  };
  draw();
  m.addEventListener('input', e => { const i = e.target.dataset.i; if (i != null) items[i][e.target.dataset.k] = e.target.value; });
  m.addEventListener('change', e => { if (e.target.dataset.k === 'type') { items[e.target.dataset.i].type = e.target.value; if (e.target.value === 'choice' && !items[e.target.dataset.i].opts) items[e.target.dataset.i].opts = '동의,비동의'; draw(); } });
  m.addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.p != null) { const p = PRESET[t.dataset.p]; items.push(p ? { label: p[0], type: p[1], opts: p[2] } : { label: '', type: 'check', opts: '' }); draw(); }
    if (t.dataset.del != null) { items.splice(+t.dataset.del, 1); draw(); }
    if (t.dataset.up != null) { const i = +t.dataset.up; [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); }
  });
  m.querySelector('#nOk').onclick = () => {
    const target = [...m.querySelectorAll('#nC [aria-pressed=true]')].map(b => b.dataset.c).join(',');
    if (n && n.nid && itemsOf(nid).some(i => !items.find(x => x.iid === i.iid)) && !confirm('지운 항목의 회신 기록도 함께 지워져요. 저장할까요?')) return;
    if (Store.run('saveNotice', { nid: n ? n.nid : '', title: m.querySelector('#nT').value, due: m.querySelector('#nD').value, target, items })) { m.remove(); UI.sel = null; toast('저장했어요'); }
  };
  setTimeout(() => m.querySelector('#nT').focus(), 50);
}

/* ---------- 학생 ---------- */
function vStu() {
  const cs = classes(), def = LS.get(APP_KEY + '-defcls', cs[0] || '');
  return PH('학생 명단') + `<div class="grid2"><div class="card"><h2>학생 등록</h2>
  <p class="muted" style="margin:0 0 6px">한 줄에 한 명씩 <b>번호 이름</b> 또는 <b>학급 번호 이름</b>으로 적어요. 엑셀에서 복사해 붙여 넣어도 돼요.<br>여러 학급을 함께 관리하면(학생회·업무용) 학급을 적어 주세요.</p>
  <label class="f">학급을 안 적은 줄의 기본 학급</label><input id="defCls" value="${esc(def)}" placeholder="예: 4-1">
  <textarea id="stuPaste" style="margin-top:8px" placeholder="1 김하늘&#10;2 이도윤&#10;5-1 3 박서연"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="addStu()">등록하기</button></div></div>
  <div class="card"><h2>명단 (${DB().students.length}명)</h2>${DB().students.length ? `<table class="list"><tr><th>학급</th><th>번호</th><th>이름</th><th></th></tr>${DB().students.map(s => `<tr><td>${esc(s.cls)}</td><td>${esc(s.no)}</td><td><b>${esc(s.name)}</b></td><td><button class="sm danger" onclick="confirm('${esc(s.name)} 학생을 지울까요?')&&Store.run('delStudent',{cls:'${esc(s.cls)}',no:'${esc(s.no)}'})">지우기</button></td></tr>`).join('')}</table>` : '<div class="empty">아직 학생이 없어요.</div>'}</div></div>`;
}
function addStu() {
  const def = $('#defCls').value.trim(); LS.set(APP_KEY + '-defcls', def);
  const list = $('#stuPaste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const c = line.split(/[\t,]+|\s+/).filter(Boolean);
    if (c.length >= 3 && /^\d+$/.test(c[1])) return { cls: c[0], no: c[1], name: c.slice(2).join(' ') };
    if (/^\d+$/.test(c[0])) return { cls: def, no: c[0], name: c.slice(1).join(' ') };
    return null;
  }).filter(s => s && s.name);
  if (!list.length) return toast('「번호 이름」 형식으로 적어 주세요', true);
  if (Store.run('addStudents', { list })) toast(list.length + '명 등록했어요');
}

/* ---------- 설정 ---------- */
function vSet() {
  const c = Store.cfg();
  return PH('자료 관리', c.url ? '구글 시트에 저장돼서 연결한 모든 기기에서 같은 회신 대장을 봐요. 30초마다 새로 불러와요.' : '지금은 이 기기 브라우저에만 저장돼요. 구글 시트에 연결하면 다른 기기에서도 같이 볼 수 있어요.') + `
  <div class="grid2"><div class="card"><h2>구글 시트 연결</h2>
  <label class="f">Apps Script 웹 앱 주소 (…/exec 로 끝나요)</label><input id="sUrl" style="width:100%" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="f">연결 비밀번호 (Code.gs 맨 위 PASSWORD와 같게)</label><input id="sPw" type="password" style="width:100%" value="${esc(c.pw)}">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveConn()">저장하고 연결</button>${c.url ? '<button onclick="disconnect()">연결 끊기</button>' : ''}</div>
  ${!c.url && DB().notices.length && !DB().notices.some(n => /^Ndemo/.test(n.nid)) ? '<p class="muted">이 기기에 있던 기록을 시트로 옮기려면, 연결하기 전에 아래 <b>백업 파일 저장</b>을 먼저 해 두고 연결 후 <b>백업 불러오기</b>를 하세요.</p>' : ''}</div>
  <div class="card"><h2>다른 기기에서 열기</h2>${c.url ? `<p class="muted" style="margin:0 0 10px">이 주소를 다른 컴퓨터나 태블릿에서 한 번 열면 시트 연결까지 저절로 돼요. 연결 정보가 들어 있으니 선생님 기기에서만 여세요.</p>
  <div class="row"><input id="devUrl" readonly style="flex:1;min-width:200px" value="${esc(devLink())}"><button class="btn" onclick="copyText($('#devUrl').value)">주소 복사</button></div>` : '<p class="muted" style="margin:0">구글 시트에 연결하면 다른 기기에 넣을 주소가 여기에 나와요.</p>'}</div></div>
  <div class="grid2"><div class="card"><h2>백업</h2><p class="muted" style="margin:0 0 12px">학생 명단, 통신문, 회신 기록을 파일 하나로 저장하거나 불러와요.${c.url ? ' 불러오면 시트 내용이 백업 내용으로 바뀌어요.' : ''}</p>
  <div class="row"><button class="btn" onclick="backup()">백업 파일 저장</button><label class="row" style="cursor:pointer"><span style="border:1px solid var(--rule);border-radius:4px;padding:8px 14px;font-weight:600;background:#fff">백업 불러오기</span><input type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></label></div></div>
  ${c.url ? '' : `<div class="card"><h2>처음부터 다시</h2><p class="muted" style="margin:0 0 12px">이 기기의 기록을 모두 지워요. 되돌릴 수 없으니 먼저 백업하세요.</p>
  <div class="row"><button class="danger" onclick="if(confirm('학생 명단과 통신문, 회신 기록을 모두 지울까요? 되돌릴 수 없어요.')){LS.set(APP_KEY+'-db',emptyDb());Store.init();toast('모두 지웠어요')}">모두 지우기</button>
  <button onclick="if(confirm('지금 자료를 지우고 예시 자료를 불러올까요?')){LS.set(APP_KEY+'-db',null);Store.init()}">예시 자료 불러오기</button></div></div>`}</div>`;
}
function devLink() { const c = Store.cfg(); return location.origin + location.pathname + '#c=' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: c.url, p: c.pw })))); }
async function saveConn() {
  const url = $('#sUrl').value.trim(), pw = $('#sPw').value;
  if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('주소는 https://script.google.com/… /exec 형태여야 해요', true);
  Store.setCfg({ url, pw });
  try { await Store.init(); toast('구글 시트에 연결했어요'); render(); } catch (e) { toast('연결 실패: ' + e.message, true); }
}
function disconnect() { Store.setCfg({ url: '', pw: '' }); Store.init(); toast('이 기기 저장으로 바꿨어요'); }
function backup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: APP_KEY, at: new Date().toISOString(), db: Store.db }, null, 1)], { type: 'application/json' }));
  a.download = '가정통신문_회신_백업_' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('백업 파일을 저장했어요');
}
function restore(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); if (o.app !== APP_KEY || !o.db) throw 0; } catch (_) { return toast('이 앱의 백업 파일이 아니에요', true); }
    if (!confirm('지금 자료를 백업 파일 내용으로 바꿀까요?')) return;
    if (Store.remote()) { if (Store.run('restore', { db: o.db })) { toast('백업을 시트로 불러왔어요'); go('check'); } }
    else { LS.set(APP_KEY + '-db', Object.assign(emptyDb(), o.db)); Store.init(); toast('백업을 불러왔어요'); go('check'); }
  };
  r.readAsText(f);
}

/* ---------- 시작 ---------- */
document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab); });
$('#clsSel').onchange = e => { UI.cls = e.target.value; LS.set(APP_KEY + '-cls', UI.cls); render(); };
Store.onChange = soft => render(soft);
(function () { // 다른 기기용 주소(#c=…)로 열면 연결 정보 저장
  const m = /#c=([^&]+)/.exec(location.hash);
  if (m) { try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); Store.setCfg({ url: o.u, pw: o.p }); } catch (_) {} history.replaceState(null, '', location.pathname); }
})();
Store.onSync = (s, m) => { const el = $('#sync'); el.textContent = s === 'local' ? '이 기기에만 저장 중' : s === 'saving' ? '시트에 저장 중…' : s === 'ok' ? '구글 시트 연결됨 · 다른 기기와 공유' : '시트 연결 문제'; el.title = m || ''; el.style.color = s === 'err' ? '#F09A92' : ''; };
Store.init().catch(() => go('set'));
setInterval(() => { if (!document.querySelector('.modal:not([data-stu])')) Store.refresh(); }, 30000);
</script>
</body>
</html>
